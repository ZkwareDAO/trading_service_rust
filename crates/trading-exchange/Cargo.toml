[package]
name = "trading-exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trading-core.workspace = true
trading-models.workspace = true
async-trait.workspace = true
futures-util.workspace = true
rust_decimal.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
tokio-stream.workspace = true
dashmap.workspace = true
binance-sdk.workspace = true
openssl-sys.workspace = true
# Hyperliquid：EVM secp256k1 / Keccak256 / hex / msgpack
k256.workspace = true
sha3.workspace = true
hex.workspace = true
rmp-serde.workspace = true
# ws 统一建连器：在（可选 HTTP CONNECT 代理）TCP 上自建 rustls，再交 tungstenite 明文握手。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"

# CTP 期货适配：仅在 feature="ctp" 下编译（bindgen 构建期需 libclang；
# 运行期经 libloading dlopen .so，路径走 config/venue.toml 的 [ctp] 段）。
ctp2rs = { workspace = true, optional = true }
encoding_rs = { version = "0.8", optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
ctp = ["dep:ctp2rs", "dep:encoding_rs", "dep:thiserror"]
