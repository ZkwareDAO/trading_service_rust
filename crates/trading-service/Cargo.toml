[package]
name = "trading-service"
version.workspace = true
edition.workspace = true

# 二进制同属 trading-service 包：
#   trading-service（核心服务）/ xili-exchange（本地模拟交易所服务端）
#   / strategy-client（模拟信号客户端）/ loadtest（压测）/ account-tool（账户凭证与 account.csv 管理）
[[bin]]
name = "trading-service"
path = "src/main.rs"

[[bin]]
name = "xili-exchange"
path = "src/bin/xili-exchange.rs"

[[bin]]
name = "strategy-client"
path = "src/bin/strategy-client.rs"

[[bin]]
name = "loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "account-tool"
path = "src/bin/account-tool.rs"

# 跨模块业务链 E2E（in-process）：harness 在 tests/e2e/ 下，单入口挂 scenarios 模块树。
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# 进程级黑盒 smoke：启动真实 trading-service + xili-exchange 二进制，只走 REST。
[[test]]
name = "blackbox"
path = "tests/blackbox/main.rs"

# REST 接口级测试（真实 Router + 真实装配；按接口文档逐条组织）。
[[test]]
name = "api"
path = "tests/api/main.rs"

[dependencies]
trading-core.workspace = true
trading-exchange.workspace = true
tokio.workspace = true
axum.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_qs.workspace = true
serde_json.workspace = true
toml.workspace = true
rust_decimal.workspace = true
dashmap.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
chrono.workspace = true
store-core.workspace = true
trading-models.workspace = true
trading-store.workspace = true
csv.workspace = true
rpassword.workspace = true
# Binance SDK / vendored OpenSSL / tokio-stream 已随适配器迁入 trading-exchange。

[features]
# CTP 适配（trading-exchange 的 feature="ctp" 由本 feature 透传）。
ctp = ["trading-exchange/ctp"]

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
# L1 属性测试：不变量（固定 seed / cases=10_000 门禁）
proptest = { workspace = true }
# E2E 场景注入的模拟所（dev-only）：harness 在 tests/e2e/，不进入发布物。
trading-sim.workspace = true
