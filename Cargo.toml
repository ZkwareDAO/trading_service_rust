[workspace]
resolver = "2"
members = [
    # 本服务（v0）
    "crates/trading-core",
    "crates/trading-exchange",
    "crates/trading-service",
    # 远端合入的通用存储框架（原 store-tokio 已并入 trading-store::async_rt）
    "crates/store-core",
    "crates/trading-models",
    "crates/trading-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.dependencies]
# ---- 本服务（v0）----
trading-core = { path = "crates/trading-core" }
trading-exchange = { path = "crates/trading-exchange" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 统一 reqwest 特性，避免 binance-sdk 自带的 blocking 特性间接拉起 native-tls/openssl（本机无 libssl）
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

# ---- 双方共用（特性取并集，均为远端所需的超集）----
serde = { version = "1", features = ["derive"] }
# query 字符串反序列化（支持 status[]=NEW / 重复 key 填 Vec），axum 默认 Query 不支持
serde_qs = { version = "0.15", features = ["axum"] }
toml = "0.8"
# arbitrary_precision：Decimal 经 serde_json::Number 精确落为 JSON 数字，全程不碰 f64
serde_json = { version = "1", features = ["arbitrary_precision"] }
# serde-arbitrary-precision 已包含远端所需的 serde 能力，Decimal 精确序列化为 JSON 数字
rust_decimal = { version = "1", features = ["serde-arbitrary-precision"] }
csv = "1"
rpassword = "7"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
tokio-stream = "0.1"

# ---- Binance 官方 SDK（交易所接入层用；vendored OpenSSL 适配本机无 libssl）----
binance-sdk = { version = "70.0.0", default-features = false, features = ["rustls-tls", "derivatives_trading_usds_futures"] }
openssl-sys = { version = "0.9", features = ["vendored"] }

# ---- 远端存储框架 dev-deps ----
tempfile = "3"

# ---- 账户凭证本地加密（AES-256-GCM）；OsRng 由 aead 提供，无需单独 rand ----
aes-gcm = "0.10"

# ---- 南向连接 HMAC-SHA256 鉴权（hmac 重导出 sha2/digest；subtle 恒定时间比较）----
hmac = "0.12"
sha2 = "0.10"
subtle = "2"

# ---- Hyperliquid 适配：EVM secp256k1 签名 + Keccak256(EIP-712) + 十六进制 ----
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
# MessagePack：L1 action → connectionId 的序列化（与官方 SDK rmp_serde 同款）
rmp-serde = "1.3"

# ---- CTP 期货适配（feature="ctp" 专用）：vendored ctp2rs 动态绑定 ----
ctp2rs = { path = "third_party/ctp2rs/ctp-dyn", default-features = false, features = ["v1alpha1", "ctp_v6_7_13"] }
# store-core / trading-models / trading-store 存储体系
store-core = { path = "crates/store-core" }
trading-models = { path = "crates/trading-models" }
trading-store = { path = "crates/trading-store" }
